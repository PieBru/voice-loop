[project]
name = "voice-loop"
version = "1.0.0"
description = "A minimal on-device voice agent loop. macOS Apple Silicon + Arch Linux (CUDA)."
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5",
    "numpy>=2.1",
    "silero-vad>=5.1",
    "onnxruntime>=1.17",
    "mlx-vlm>=0.4.3; sys_platform == 'darwin'",
    "pyyaml>=6.0",
    "moonshine-voice>=0.0.40,<0.0.55",  # 0.0.55 has no macOS arm64 wheel
    "livekit>=1.1.5",
    "transformers>=4.40",
    "torch>=2.0",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "faster-whisper>=1.2",
]
